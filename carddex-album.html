function parse(sid){const S=SETS[sid],out=[];
  for(const [kd,key] of [["p","P"],["t","T"],["e","E"]]){
    for(const it of (S[key]||"").split(";")){const m=it.match(/^(\d+) (.+?)(\*?)(?:@(\d+))?$/);if(!m)continue;
      const d=kd==="p"?(m[4]?+m[4]:DEXN.indexOf(m[2].replace(/^Dark /,""))+1):0;
      const c={id:sid+m[1],sid,num:+m[1],name:IT[m[2]]||IT[m[2].replace(/'/g,"’")]||m[2],dex:d,kd,h:!!m[3],tot:S.t};if(sid==="S")c.back=TOPPSB;CARDS[c.id]=c;out.push(c)}}
  return out}
function orderNeo(col){const A=[];col.s.forEach(s=>A.push(...parse(s)));
  const so=(a,b)=>SO[a.sid]-SO[b.sid]||a.num-b.num,G={};
  A.filter(c=>c.kd==="p").forEach(c=>{const u=/^Unown/.test(c.name),key=u?"QU"+c.name.match(/\[(.)\]/)[1]:"Q"+c.dex;(G[key]=G[key]||{u,dex:c.dex,L:[]}).L.push(c)});
  const gs=Object.entries(G).map(([id,g])=>{g.L.sort((a,b)=>so({sid:a.sid,num:0},{sid:b.sid,num:0})||(b.h-a.h)||a.num-b.num);
    const f=g.L[0],gc={id,sid:f.sid,num:f.num,name:f.name,dex:f.dex,kd:"p",h:f.h,tot:f.tot,opts:g.L.map(x=>x.id),u:g.u};g.L.forEach(x=>x.gid=id);CARDS[id]=gc;return gc});
  const P1=gs.filter(g=>!g.u).sort((a,b)=>a.dex-b.dex),P2=gs.filter(g=>g.u).sort((a,b)=>a.name<b.name?-1:1);
  const T=A.filter(c=>c.kd==="t").sort(so),E=A.filter(c=>c.kd==="e").sort(so);
  return [...P1,...P2,...T,...E].map(c=>({id:c.id,o:0,n:""}))}
function order(col){if(col.neo)return orderNeo(col);let L=[];col.s.forEach(s=>{const A=parse(s);A.forEach(c=>{if(!c.h)return;const t=A.find(d=>!d.h&&d.kd===c.kd&&d.name===c.name);if(t){c.alt=t.id;t.twin=c.id}});L.push(...A.filter(c=>!c.twin))});
  if(col.x){const c={id:"X1",sid:"X",num:0,name:"Mew antico",dex:151,kd:"p",h:true,tot:0,img:MEWF,back:MEWB,full:1};CARDS.X1=c;L.push(c)}
  const so=(a,b)=>SO[a.sid]-SO[b.sid]||a.num-b.num;
  const P=L.filter(c=>c.kd==="p").sort((a,b)=>a.dex-b.dex||so(a,b));
  const T=L.filter(c=>c.kd==="t").sort(so),E=L.filter(c=>c.kd==="e").sort(so);
  return [...P,...T,...E].map(c=>({id:c.id,o:0,n:""}))}

const idb=new Promise(r=>{try{const q=indexedDB.open("carddex",1);q.onupgradeneeded=()=>q.result.createObjectStore("img");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const op=async(m,k,v)=>{const d=await idb;if(!d)return null;return new Promise(r=>{try{const s=d.transaction("img",m==="get"||m==="keys"?"readonly":"readwrite").objectStore("img");const q=m==="get"?s.get(k):m==="put"?s.put(v,k):m==="del"?s.delete(k):s.getAllKeys();q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})};

async function shrink(f){const u=URL.createObjectURL(f);const im=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=u});
  const s=Math.min(1,720/im.naturalHeight),c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);return new Promise(r=>c.toBlob(r,"image/jpeg",.86))}
async function setImg(id,f){const b=await shrink(f);if(URLS[id])URL.revokeObjectURL(URLS[id]);URLS[id]=URL.createObjectURL(b);await op("put",id,b)}

  for(let k=0;k<np;k++){let inner='<div class="sheet">';for(let i=k*9;i<k*9+9;i++)inner+=i<L.length?slot(i):"<div></div>";inner+="</div>";
    h+=`<div class="pg" data-k="${k}"><div class="pb"><div class="cs"></div><div class="sh">${inner}</div><div class="flp"><div class="fg"></div></div></div></div>`}
  book.innerHTML=h;
  PG=[...book.children].map(e=>({e,pb:e.firstChild,cs:e.querySelector(".cs"),sh:e.querySelector(".sh"),fl:e.querySelector(".flp"),fg:e.querySelector(".fg"),W:0,H:0}))}
function render(){build();layoutPages()}
function layoutPages(){const BW=book.clientWidth,BH=book.clientHeight,was=LS;LS=BW>BH&&BW>=520;
  if(LS&&!was)sp=pg?Math.ceil(pg/2):0;if(!LS&&was)pg=sp?2*sp-1:0;
  pg=Math.min(pg,np-1);sp=Math.min(sp,smax());
  const FS=matchMedia("(orientation:landscape) and (max-height:700px)").matches,MG=FS?4:10,SPG=3,M=FS?8:12,gp=FS?6:8,pw=LS?BW/2:BW,aw=pw-MG-(LS?SPG:MG),ah=BH-2*MG;
  const cw=Math.max(20,Math.floor(Math.min((aw-2*M-2*gp)/3,(ah-2*M-2*gp)/3*63/88))),ch=Math.floor(cw*88/63),ws=3*cw+2*gp+2*M,hs=3*ch+2*gp+2*M;
  book.style.setProperty("--cw",cw+"px");book.style.setProperty("--ch",ch+"px");book.style.setProperty("--gp",gp+"px");book.style.setProperty("--sp",M+"px");
  PG.forEach((o,k)=>{o.e.style.width=pw+"px";o.e.style.left=(LS&&k%2===0?BW/2:0)+"px";o.e.className="pg"+(LS?(k%2?" pl":" pr"):"");
    const lx=!LS?(pw-ws)/2:(k%2?pw-SPG-ws:SPG);
    o.pb.style.left=lx+"px";o.pb.style.top=(BH-hs)/2+"px";o.pb.style.width=ws+"px";o.pb.style.height=hs+"px";o.W=ws;o.H=hs});
  applyState()}
function resetCurl(o){o.sh.style.clipPath="";o.cs.style.display="none";o.fl.style.display="none";o.fl.style.opacity=1}
function applyState(){const v=new Set();
  if(!LS){v.add(pg);if(pg+1<np)v.add(pg+1)}
  else{const R=Rof(sp),Lp=Lof(sp);if(R<np){v.add(R);if(R+2<np)v.add(R+2)}if(Lp>=1){v.add(Lp);if(Lp>=3)v.add(Lp-2)}}
  PG.forEach((o,k)=>{o.e.style.visibility=v.has(k)?"visible":"hidden";o.e.style.zIndex=(LS&&k%2)?k:np-k;resetCurl(o)});
  foot();stat()}
function foot(){let t;
  if(cur==="?"&&!SR.length){$("#pn").textContent="Nessun risultato per “"+SQ+"”";$("#hud").textContent=$("#pn").textContent;return}
  if(!LS)t="Pagina "+(pg+1)+" / "+np;
  else{const a=Lof(sp)+1,b=Rof(sp)<np?Rof(sp)+1:0;t=sp?"Pagine "+a+(b?"–"+b:"")+" / "+np:"Pagina 1 / "+np}
  if(cur==="?")t="“"+SQ+"” · "+t;$("#pn").textContent=t;$("#hud").textContent=t}
function clipP(P,f){const out=[];for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],fa=f(a[0],a[1]),fb=f(b[0],b[1]);
  if(fa>=0)out.push(a);if((fa>=0)!==(fb>=0)){const u=fa/(fa-fb);out.push([a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u])}}return out}
/* piega: t=0 pagina piatta, t=1 pagina girata; dir=1 angolo basso-destra, -1 basso-sinistra */
function setCurl(k,t,dir){const o=PG[k],W=o.W,H=o.H;if(t<=.002){resetCurl(o);return}
  const e=Math.min(1,t),Px=W*(1-2*e),Py=H;
  let nx=W-Px,ny=H-Py;const Ln=Math.hypot(nx,ny)||1;nx/=Ln;ny/=Ln;
  const Mx=(W+Px)/2,My=(H+Py)/2,sd=(x,y)=>(x-Mx)*nx+(y-My)*ny,ext=LS?W:0;
  const rect=[[0,0],[W,0],[W,H],[0,H]],front=clipP(rect,(x,y)=>-sd(x,y)),corner=clipP(rect,sd);
  let flap=corner.map(([x,y])=>{const d=sd(x,y);return[x-2*d*nx,y-2*d*ny]});
  flap=clipP(clipP(clipP(clipP(flap,(x,y)=>x+ext),(x,y)=>W-x),(x,y)=>y),(x,y)=>H-y);
  const mx=p=>[dir>0?p[0]:W-p[0],p[1]],ox=dir>0?-ext:0;
  const str=(pts,off)=>pts.length<3?"polygon(0 0,0 0,0 0)":"polygon("+pts.map(p=>{const q=mx(p);return(q[0]-off).toFixed(1)+"px "+q[1].toFixed(1)+"px"}).join(",")+")";
  const gx=dir>0?nx:-nx,gy=ny,fxP=mx([Mx,My])[0];
  const grad=(bw,fx)=>{const th=Math.atan2(gx,-gy)*180/Math.PI,Lg=Math.abs(bw*gx)+Math.abs(H*gy),fp=(fx-bw/2)*gx+(My-H/2)*gy+Lg/2;return[th,fp]};
  o.sh.style.clipPath=str(front,0);
  const[t1,f1]=grad(W,fxP);o.cs.style.display="block";o.cs.style.clipPath=str(corner,0);
  o.cs.style.background=`linear-gradient(${t1}deg,rgba(0,0,0,.6) ${f1}px,rgba(0,0,0,.2) ${f1+34}px,rgba(0,0,0,0) ${f1+90}px)`;
  const[t2,f2]=grad(W+ext,fxP-ox);o.fl.style.display="block";o.fl.style.left=ox+"px";o.fl.style.width=(W+ext)+"px";o.fl.style.clipPath=str(flap,ox);
  o.fg.style.background=`linear-gradient(${t2}deg,rgba(0,0,0,.65) ${f2-150}px,rgba(0,0,0,0) ${f2-45}px,rgba(255,255,255,.2) ${f2-6}px,rgba(255,255,255,.03) ${f2}px)`}
function animT(k,a,b,dir,ms,cb){busy=1;const t0=performance.now();
  (function fr(n){const u=Math.min(1,(n-t0)/ms),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;setCurl(k,a+(b-a)*e,dir);
    if(u<1)requestAnimationFrame(fr);else{busy=0;if(cb)cb()}})(t0)}
const canFwd=()=>LS?sp<smax():pg<np-1,canBack=()=>LS?sp>0:pg>0;
const tOf=p=>D.mode==="pb"?1-p:p;
function dragBegin(fwd){const k=!LS?(fwd?pg:pg-1):(fwd?Rof(sp):Lof(sp));
  D={k,fwd,mode:LS?(fwd?"lf":"lb"):(fwd?"pf":"pb"),dir:LS&&!fwd?-1:1,p:0};
  const o=PG[k];o.e.style.visibility="visible";o.e.style.zIndex=1000;setCurl(k,tOf(0),D.dir)}
function dragMove(dx){const o=PG[D.k],p=Math.max(0,Math.min(1,(D.fwd?-dx:dx)/(o.W*.8)));D.p=p;setCurl(D.k,tOf(p),D.dir)}
function dragEnd(dx,v){const k=D.k,o=PG[k],mode=D.mode,dir=D.dir,t0=tOf(D.p),fast=D.fwd?v<-.45:v>.45,go=D.p>.3||(fast&&D.p>.04);busy=1;
  if(!go){const tg=mode==="pb"?1:0;animT(k,t0,tg,dir,Math.max(140,260*Math.abs(t0-tg)),()=>{applyState()});return}
  const tg=mode==="pb"?0:1;
  if(mode==="lf")PG[Lof(sp+1)].e.style.visibility="visible";
  if(mode==="lb")PG[Rof(sp-1)].e.style.visibility="visible";
  animT(k,t0,tg,dir,Math.max(200,440*Math.abs(tg-t0)),()=>{
    if(mode==="pf"){pg++;applyState()}else if(mode==="pb"){pg--;applyState()}
    else{busy=1;o.fl.style.opacity=0;setTimeout(()=>{sp+=mode==="lf"?1:-1;busy=0;applyState()},270)}})}
addEventListener("resize",()=>{if(!busy)layoutPages()});

const sicon=sid=>IC[sid]?`<span class="si" style="--r:${IC[sid].r};-webkit-mask-image:url(${IC[sid].u});mask-image:url(${IC[sid].u})"></span>`:"";
let PREV="a";
function exitSearch(){cur=PREV||"a";SR=[];SQ="";pg=0;sp=0;tabs();render()}
function tabs(){$("#sq").classList.toggle("on",cur==="?");$("#sq").innerHTML=cur==="?"?XI:LENS;$("#sq").setAttribute("aria-label",cur==="?"?"Chiudi ricerca":"Cerca Pokémon");$("#tabs").innerHTML=COLS.map(c=>`<button class="tab ${c.k===cur?"on":""}" data-k="${c.k}" aria-label="${c.t}">${c.s.map(sicon).join("")}</button>`).join("")}
$("#tabs").onclick=e=>{const b=e.target.closest(".tab"),k=b&&b.dataset.k;if(k&&k!==cur){cur=k;SR=[];SQ="";pg=0;sp=0;tabs();render()}};
function confirmSheet(t,f){sheet([["Sì, conferma",f,1]],t)}
$("#rs").onclick=()=>{if(cur==="?"){sheet([["Esci dalla ricerca",exitSearch]],"Il ripristino vale per le singole collezioni");return}
  confirmSheet("Rimettere le carte nell’ordine originale? Stato, note, varianti e foto restano.",()=>{const col=COLS.find(c=>c.k===cur),idx={};order(col).forEach((x,i)=>{if(!(x.id in idx))idx[x.id]=i});
    const L=st[cur],C=L.filter(x=>x.id).map((x,j)=>[x,j]).sort((p,q)=>((idx[p[0].id]!==undefined?idx[p[0].id]:1e9)-(idx[q[0].id]!==undefined?idx[q[0].id]:1e9))||p[1]-q[1]).map(p=>p[0]);
    st[cur]=[...C,...L.filter(x=>!x.id)];save();pg=0;sp=0;render()})};

function doSearch(q){q=q.trim().toLowerCase();if(!q)return;SR=[];
  COLS.forEach(c=>st[c.k].forEach((s,i)=>{const k=s.id&&CARDS[s.id];if(k&&k.kd==="p"&&k.name.toLowerCase().includes(q))SR.push({c:c.k,i})}));
  if(cur!=="?")PREV=cur;SQ=q;cur="?";pg=0;sp=0;tabs();render()}
$("#sq").onclick=()=>{if(cur==="?"){exitSearch();return}$("#sri").value=SQ;$("#sr").hidden=false;setTimeout(()=>$("#sri").focus(),50)};
$("#srok").onclick=()=>{$("#sr").hidden=true;doSearch($("#sri").value)};
$("#srno").onclick=()=>{$("#sr").hidden=true};
$("#sri").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("#srok").click()}};
/* gesti: tocco = apri, doppio tocco = ottenuta, pressione lunga = menu */
let g=null,last={i:-1,t:0},tm;
book.addEventListener("pointerdown",e=>{if(g||busy)return;const s=e.target.closest(".slot");
  g={i:s?+s.dataset.i:-1,x:e.clientX,y:e.clientY,lx:e.clientX,lt:Date.now(),v:0,lp:0,mv:0,drag:0};
  if(s)g.t=setTimeout(()=>{if(g&&!g.mv){g.lp=1;if(navigator.vibrate)navigator.vibrate(15);menu(g.i)}},450);
  try{book.setPointerCapture(e.pointerId)}catch(x){}});
book.addEventListener("pointermove",e=>{if(!g)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;
  if(!g.mv&&(Math.abs(dx)>10||Math.abs(dy)>10)){g.mv=1;clearTimeout(g.t);
    if(Math.abs(dx)>Math.abs(dy)){const fwd=dx<0;if(fwd?canFwd():canBack()){g.drag=1;dragBegin(fwd)}}}
  if(g.drag){const n=Date.now();g.v=(e.clientX-g.lx)/Math.max(1,n-g.lt);g.lx=e.clientX;g.lt=n;dragMove(dx)}});
book.addEventListener("pointerup",e=>{if(!g)return;clearTimeout(g.t);const x=g;g=null;
  if(x.drag)dragEnd(e.clientX-x.x,x.v);else if(!x.lp&&!x.mv&&x.i>=0)tap(x.i)});
book.addEventListener("pointercancel",()=>{if(!g)return;clearTimeout(g.t);const d=g.drag;g=null;if(d)dragEnd(0,0)});
book.addEventListener("contextmenu",e=>e.preventDefault());
function tap(i){const n=Date.now();clearTimeout(tm);
  if(last.i===i&&n-last.t<320){last={i:-1,t:0};toggle(i)}
  else{last={i,t:n};tm=setTimeout(()=>{const s=LIST()[i];if(s&&s.id&&s.o)openCard(i)},320)}}
function toggle(i){const s=LIST()[i];if(!s||!s.id)return;const c=CARDS[s.id];
  if(s.o){s.o=0;s.v="h";done(i);return}
  if(c.opts){askGroup(i);return}
  if(c.alt){askVariant(i);return}
  s.o=1;done(i)}
function pickCard(title,opts,f){const s=$("#sh"),mix=opts.some(o=>o.c.h)&&opts.some(o=>!o.c.h);
  s.innerHTML='<div class="sb"><p></p><div class="th"></div></div><div class="sbc"></div>';s.querySelector("p").textContent=title;const th=s.querySelector(".th");
  opts.forEach(o=>{const b=document.createElement("button");
    b.innerHTML=`<div class="tp">${face(o.c)}${mix&&o.c.h?HOLO.replace("class=\"hs\"","class=\"hi\""):""}</div><b>${esc(SETS[o.c.sid].n)}</b><small>${esc(numTxt(o.c))}</small>`;
    b.onclick=()=>{s.hidden=true;f(o.v)};th.appendChild(b)});
  const x=document.createElement("button");x.textContent="Annulla";x.onclick=()=>{s.hidden=true};s.lastChild.appendChild(x);s.hidden=false}
function askVariant(i){const s=LIST()[i],c=CARDS[s.id];pickCard(c.name+" — quale carta hai?",[{c,v:"h"},{c:CARDS[c.alt],v:"n"}],v=>setVar(i,v))}
function askGroup(i){const s=LIST()[i],c=CARDS[s.id];if(c.opts.length===1){setVar(i,c.opts[0]);return}
  pickCard(c.name+" — quale carta hai?",c.opts.map(x=>({c:CARDS[x],v:x})),v=>setVar(i,v))}
function setVar(i,v){const s=LIST()[i];s.o=1;s.v=v;done(i)}
function done(i){save();const e=book.querySelector(`[data-i="${i}"]`);if(e)e.outerHTML=slot(i);stat()}

function sheet(items,title){const s=$("#sh");s.innerHTML='<div class="sb"><p></p></div><div class="sbc"></div>';s.querySelector("p").textContent=title;const b=s.firstChild,c=s.lastChild;
  items.forEach(([t,f,d])=>{const e=document.createElement("button");e.textContent=t;if(d)e.className="dg";e.onclick=()=>{s.hidden=true;f()};b.appendChild(e)});
  const x=document.createElement("button");x.textContent="Annulla";x.onclick=()=>{s.hidden=true};c.appendChild(x);s.hidden=false}
$("#sh").onclick=e=>{if(e.target.id==="sh")e.target.hidden=true};
function noteEd(s,t){$("#nl").textContent=t;$("#nta").value=s.n||"";$("#ne").hidden=false;
  $("#nok").onclick=()=>{s.n=$("#nta").value.trim();save();$("#ne").hidden=true;render()};$("#nno").onclick=()=>{$("#ne").hidden=true}}
function menu(i){const L=LIST(),s=L[i],c=s.id&&CARDS[s.id],it=[];
  if(s.id)it.push([s.o?"Segna come non ottenuta":"Segna come ottenuta",()=>toggle(i)]);
  if(c&&c.alt&&s.o)it.push(["Cambia variante (Holo / Non Holo)",()=>askVariant(i)]);
  if(c&&c.opts&&c.opts.length>1&&s.o)it.push(["Cambia set / variante",()=>askGroup(i)]);
  if(s.id){it.push([URLS[s.id]?"Cambia foto":"Carica foto",()=>pick(i,false)]);it.push(["Carica foto da qui in avanti",()=>pick(i,true)])}
  if(s.id&&URLS[s.id])it.push(["Rimuovi foto",()=>{URL.revokeObjectURL(URLS[s.id]);delete URLS[s.id];op("del",s.id);render()}]);
  it.push([s.n?"Modifica nota":"Aggiungi nota",()=>noteEd(s,c?c.name:"Slot vuoto")]);
  if(s.n)it.push(["Rimuovi nota",()=>{s.n="";save();render()}]);
  if(s.id){it.push(["Carica retro (per tutte le carte)",()=>{fb.value="";fb.click()}]);if(URLS.BACK)it.push(["Ripristina retro standard",()=>{URL.revokeObjectURL(URLS.BACK);delete URLS.BACK;op("del","BACK");applyBack(window.__vc)}])}
  if(cur!=="?"){it.push(["Inserisci slot vuoto prima",()=>{L.splice(i,0,{id:null,o:0,n:""});save();render()}]);
  it.push(["Inserisci slot vuoto dopo",()=>{L.splice(i+1,0,{id:null,o:0,n:""});save();render()}]);
  if(s.id)it.push(["Duplica (aggiungi doppione)",()=>{L.splice(i+1,0,{id:s.id,o:0,n:""});save();render()}]);
  it.push(["Elimina dalla collezione",()=>confirmSheet("Eliminare? Le carte successive scorrono indietro.",()=>{L.splice(i,1);save();render()}),1])}
  sheet(it,c?c.name:"Slot vuoto")}

/* visualizzatore 3D */
const card=$("#card"),stg=$("#stage"),hl=$(".hl");let ry=0,rx=0,dr=null,curH=false;
const ap=()=>{card.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;
  const a=((ry%360)+540)%360-180,k=Math.max(-1,Math.min(1,a/45)),m=Math.max(-1,Math.min(1,rx/35));
  card.style.setProperty("--gx",(50-k*45)+"%");card.style.setProperty("--gy",(50+m*45)+"%");
  card.style.setProperty("--hx",(50+k*50)+"%");card.style.setProperty("--hy",(50+m*50)+"%");
  const b2=((ry+180)%360+540)%360-180,k2=Math.max(-1,Math.min(1,b2/45));card.style.setProperty("--gx2",(50-k2*45)+"%");card.style.setProperty("--hx2",(50+k2*50)+"%");const hb=document.querySelector(".bk .hl");hb.style.opacity=0;const fu=hl.classList.contains("full");hl.style.opacity=curH?((fu?.1:.3)+(fu?.3:.55)*Math.min(1,Math.hypot(k,m))):0};
function applyBack(c){const b=document.querySelector(".bk"),u=(c&&c.back)||URLS.BACK||DEFBACK;b.style.backgroundImage=u?`url(${u})`:"";b.classList.toggle("ph2",!!u)}
const fb=$("#fb");
fb.onchange=async()=>{const f=fb.files[0];if(!f)return;try{await setImg("BACK",f)}catch(e){}applyBack(window.__vc)};
function openCard(i){const s=LIST()[i],c=eff(s);
  $("#vh").textContent=(c.kd==="p"&&c.dex?"#"+pad(c.dex)+" ":"")+c.name;
  $("#vs").innerHTML=sicon(c.sid)+[esc(SETS[c.sid]?SETS[c.sid].n:"Promo"),c.h?"Holo":"",esc(numTxt(c))].filter(Boolean).join(" · ");
  window.__vc=c;$("#vn").textContent=s.n||"";$("#fr").innerHTML=face(c,1);
  curH=!!c.h;hl.classList.toggle("full",!!c.full);applyBack(c);ry=rx=0;card.style.transition="";ap();$("#vw").hidden=false}
stg.onpointerdown=e=>{dr={x:e.clientX,y:e.clientY,a:ry,b:rx};card.style.transition="";stg.setPointerCapture(e.pointerId)};
stg.onpointermove=e=>{if(!dr)return;ry=dr.a+(e.clientX-dr.x)*.7;rx=Math.max(-40,Math.min(40,dr.b-(e.clientY-dr.y)*.4));ap()};
stg.onpointerup=stg.onpointercancel=()=>{if(!dr)return;dr=null;card.style.transition="transform .3s";ry=Math.round(ry/180)*180;rx=0;ap()};
$("#vx").onclick=()=>{$("#vw").hidden=true};
$("#hud").onclick=()=>document.body.classList.toggle("ui");
document.addEventListener("pointerdown",e=>{if(document.body.classList.contains("ui")&&!e.target.closest("header,footer,#hud,#sh,#ne,#sr"))document.body.classList.remove("ui")},true);
tabs();render();requestAnimationFrame(render);loadImgs().then(()=>{render();applyBack()});
</script></body></html>
