<style>
:root{--bg:#0d1b2a;--bg2:#1b3350;--sl:#d5dce8;--gold:#d9b45a;--tx:#eef1f7;--mut:#9fb0d0;--sb:#1b2a49;--bt:#26375c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif}
body{background:radial-gradient(120% 80% at 50% 0,var(--bg2),var(--bg) 60%)}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 14px 6px}
h1{margin:0;font:600 26px Georgia,"Times New Roman",serif;color:var(--gold);display:flex;justify-content:space-between;align-items:baseline}
h1 small{font:400 13px "Avenir Next","Trebuchet MS",system-ui,sans-serif;color:var(--mut)}
.tabs{display:flex;gap:8px;margin-top:8px}
.tab{flex:1;padding:9px 6px;border-radius:20px;border:1px solid #3a5272;background:#0d1b2a88;color:#a9b8d6;font:inherit;font-size:13px}
.tab.on{background:var(--gold);border-color:var(--gold);color:#1a1405;font-weight:600}
#book{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;touch-action:pan-x;scrollbar-width:none}
#book::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:center;padding:8px 12px;display:flex;will-change:transform}
.sheet{position:relative;flex:1;min-height:0;background:linear-gradient(160deg,#f7f9fc,#dde4ee);border-radius:4px 10px 10px 4px;padding:14px 12px 14px 20px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px;box-shadow:inset 0 0 0 1px #fff9,0 10px 24px #000b}
.sheet::before{content:"";position:absolute;left:5px;top:8%;bottom:8%;width:8px;background:radial-gradient(circle,#7b889c 38%,transparent 42%) 0 0/8px 64px repeat-y}
.slot{position:relative;height:100%;max-width:100%;aspect-ratio:63/88;margin:auto;border-radius:5px;background:var(--sl);overflow:hidden;min-height:0;box-shadow:0 0 0 2px #ffffffcc,0 0 0 3px #aab6c9,0 3px 7px #0005}
.slot.on::after{content:"";position:absolute;inset:0;background:none;pointer-events:none}
.slot img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.slot:not(.on) img,.slot:not(.on) .ph{filter:grayscale(1) contrast(.9) brightness(.95)}
.slot.em{background:none;box-shadow:none;border:2px dashed #aab6cb}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;padding:6px 4px;text-align:center;color:#1d2a44;line-height:1.15}
.ph b{font:700 15px Georgia,serif}
.ph span{font-size:11px;font-weight:600}
.ph i{font-style:normal;font-size:10px;opacity:.7}
.kp{background:linear-gradient(160deg,#f6e7a6,#e6c35c)}
.kt{background:linear-gradient(160deg,#cfe3f7,#8fb4dc)}
.ke{background:linear-gradient(160deg,#f7c9c4,#e08a80)}
.nt{position:absolute;right:3px;top:3px;font-size:13px;background:#fffd;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
footer{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 16px 10px;font-size:13px;color:var(--mut)}
footer button{background:none;border:0;color:var(--mut);font:inherit;text-decoration:underline;padding:6px 0}
#sh,#ne,#sr{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:5}
.sb{width:100%;background:var(--sb);border-radius:14px 14px 0 0;padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.sb p{margin:4px 6px 10px;color:var(--mut);font-size:13px}
.sb button{display:block;width:100%;padding:13px;margin-top:6px;border:0;border-radius:9px;background:var(--bt);color:#fff;font:inherit;font-size:15px;text-align:left}
.sb button.dg{color:#ff8a80}
.sb textarea{width:100%;padding:10px;border-radius:9px;border:1px solid #3a5272;background:#0d1b2a;color:#fff;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
#vw{position:fixed;inset:0;background:#080d1af2;z-index:6;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.vt{padding:14px 56px 4px 18px}
.vt b{display:block;font:600 22px Georgia,serif}
.vt small{display:block;color:var(--mut);margin-top:3px;font-size:13px}
.vt em{display:block;margin-top:8px;font-style:normal;color:#ffd98a;font-size:14px}
#stage{flex:1;perspective:900px;display:flex;align-items:center;justify-content:center;touch-action:none}
#card{width:min(78vw,calc(56vh*63/88));aspect-ratio:63/88;position:relative;transform-style:preserve-3d}
#card>*{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4.5%;box-shadow:0 12px 30px #000a;overflow:hidden}
#fr img{width:100%;height:100%;object-fit:cover;display:block}
#fr .ph b{font-size:34px}#fr .ph span{font-size:21px}#fr .ph i{font-size:15px}
.bk{transform:rotateY(180deg);background:radial-gradient(circle at 50% 40%,#2f5ec4,#18306d 70%);border:7px solid #e8c34a;display:flex;align-items:center;justify-content:center}
.bk i{width:46%;aspect-ratio:1;border-radius:50%;border:4px solid #14182a;background:linear-gradient(#e0453a 0 45%,#14182a 45% 55%,#f4f4f4 55%)}
#vx,#vf{position:absolute;border:0;color:#fff;background:var(--bt);border-radius:20px;font:inherit}
#vx{top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:38px;height:38px;font-size:18px}
#vf{bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:11px 22px;font-size:15px}

function parse(sid){const S=SETS[sid],out=[];
  for(const [kd,key] of [["p","P"],["t","T"],["e","E"]]){
    for(const it of (S[key]||"").split(";")){const m=it.match(/^(\d+) (.+?)(\*?)(?:@(\d+))?$/);if(!m)continue;
      const d=kd==="p"?(m[4]?+m[4]:DEXN.indexOf(m[2].replace(/^Dark /,""))+1):0;
      const c={id:sid+m[1],sid,num:+m[1],name:IT[m[2]]||IT[m[2].replace(/'/g,"’")]||m[2],dex:d,kd,h:!!m[3],tot:S.t};if(sid==="S")c.back=["https://archives.bulbagarden.net/wiki/Special:FilePath/Topps_series_"+(c.num<=76?1:c.num<=117?2:3)+"_"+c.num+"_back.jpg?width=500",TOPPSB];CARDS[c.id]=c;out.push(c)}}
  return out}
function orderNeo(col){const A=[];col.s.forEach(s=>A.push(...parse(s)));
  const so=(a,b)=>SO[a.sid]-SO[b.sid]||a.num-b.num,G={};
  A.filter(c=>c.kd==="p").sort((a,b)=>(a.sid==="T")-(b.sid==="T")).forEach(c=>{const u=/^Unown/.test(c.name),key=u?"QU"+c.name.match(/\[(.)\]/)[1]:"Q"+c.dex;if(!G[key]){if(c.sid==="T"&&!u)return;G[key]={u,dex:c.dex,L:[]}}G[key].L.push(c)});
  const gs=Object.entries(G).map(([id,g])=>{g.L.sort((a,b)=>so({sid:a.sid,num:0},{sid:b.sid,num:0})||(b.h-a.h)||a.num-b.num);
    const f=g.L[0],gc={id,sid:f.sid,num:f.num,name:f.name,dex:f.dex,kd:"p",h:f.h,tot:f.tot,opts:g.L.map(x=>x.id),u:g.u};g.L.forEach(x=>x.gid=id);CARDS[id]=gc;return gc});
  const P1=gs.filter(g=>!g.u).sort((a,b)=>a.dex-b.dex),P2=gs.filter(g=>g.u).sort((a,b)=>a.name<b.name?-1:1);
  const T=A.filter(c=>c.kd==="t").sort(so),E=A.filter(c=>c.kd==="e").sort(so);
  return [...P1,...P2,...T,...E].map(c=>({id:c.id,o:0,n:""}))}
function order(col){if(col.neo)return orderNeo(col);let L=[];col.s.forEach(s=>{const A=parse(s);A.forEach(c=>{if(!c.h)return;const t=A.find(d=>!d.h&&d.kd===c.kd&&d.name===c.name);if(t){c.alt=t.id;t.twin=c.id}});L.push(...A.filter(c=>!c.twin))});
  if(col.x){const c={id:"X1",sid:"X",num:0,name:"Mew antico",dex:151,kd:"p",h:true,tot:0,img:MEWF,back:MEWB,full:1};CARDS.X1=c;L.push(c)}
  const so=(a,b)=>SO[a.sid]-SO[b.sid]||a.num-b.num;
  const P=L.filter(c=>c.kd==="p").sort((a,b)=>a.dex-b.dex||so(a,b));
  const T=L.filter(c=>c.kd==="t").sort(so),E=L.filter(c=>c.kd==="e").sort(so);
  return [...P,...T,...E].map(c=>({id:c.id,o:0,n:""}))}

async function shrink(f){const u=URL.createObjectURL(f);const im=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=u});
  const s=Math.min(1,720/im.naturalHeight),c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);return new Promise(r=>c.toBlob(r,"image/jpeg",.86))}
